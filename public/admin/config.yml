backend:
  name: github
  repo: write-tim/blog-thefunhavers
  branch: main
  base_url: https://sveltia-gatekeeper.onrender.com
  auth_endpoint: auth

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
        }
      - {
          label: "Updated Date",
          name: "updated",
          widget: "datetime",
          required: false,
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
        }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options: ["life", "travel", "adventures", "tech"],
          default: "life",
        }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Timothy Johnson",
        }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - {
          label: "Draft",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "trips"
    label: "Travel Trips"
    folder: "src/content/trips"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Place", name: "place", widget: "string" }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - { label: "Summary", name: "summary", widget: "string" }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Highlights", name: "highlights", widget: "list" }
      - { label: "Rotating Circle Photos", name: "circlePhotos", widget: "list", field: { label: "Photo", name: "photo", widget: "image" } }
      - { label: "Gallery Photos", name: "gallery", widget: "list", field: { label: "Photo", name: "photo", widget: "image" } }
      - { label: "Story (Body)", name: "body", widget: "markdown" }
